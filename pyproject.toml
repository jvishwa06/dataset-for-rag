[project]
name = "livo-extractor"
version = "0.1.0"
description = "Extracts transcripts from YouTube videos and saves them as text files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.4",
    "indictranstoolkit>=1.1.1",
    "mock>=5.2.0",
    "mosestokenizer>=1.2.1",
    "nltk>=3.9.4",
    "pandas>=3.0.1",
    "regex>=2026.2.28",
    "sacremoses>=0.1.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    "transformers==4.53.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.3.17",
]
